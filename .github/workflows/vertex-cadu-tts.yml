name: VERTEX Cadu TTS

on:
  push:
    paths:
      - "content-pipeline/input.txt"
      - ".github/workflows/vertex-cadu-tts.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synthesize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Download Piper and Cadu voice
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/piper .cache/voice content-pipeline/out
          curl -L --fail --retry 3             "https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_x86_64.tar.gz"             -o /tmp/piper.tar.gz
          tar -xzf /tmp/piper.tar.gz -C .cache/piper
          curl -L --fail --retry 3             "https://huggingface.co/rhasspy/piper-voices/resolve/main/pt/pt_BR/cadu/medium/pt_BR-cadu-medium.onnx"             -o .cache/voice/pt_BR-cadu-medium.onnx
          curl -L --fail --retry 3             "https://huggingface.co/rhasspy/piper-voices/resolve/main/pt/pt_BR/cadu/medium/pt_BR-cadu-medium.onnx.json"             -o .cache/voice/pt_BR-cadu-medium.onnx.json

      - name: Generate narration
        shell: bash
        run: |
          set -euo pipefail
          TEXT="$(cat content-pipeline/input.txt)"
          printf "%s" "$TEXT" | .cache/piper/piper/piper             --model .cache/voice/pt_BR-cadu-medium.onnx             --output_file content-pipeline/out/cadu.wav             --length_scale 0.93

      - name: Commit generated audio
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "vertex-content-bot"
          git config user.email "vertex-content-bot@users.noreply.github.com"
          git add content-pipeline/out/cadu.wav
          if git diff --cached --quiet; then
            echo "No audio changes."
          else
            git commit -m "chore(content): generate Cadu narration"
            git push origin HEAD:${{ github.ref_name }}
          fi
